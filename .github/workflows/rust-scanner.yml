name: Rust scanner

on:
  push:
    branches: [main, 'ci/**']
    paths:
      - 'web/scan-wasm/**'
      - 'web/src/scan/**'
      - 'web/scripts/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/vite.config.ts'
      - 'web/vitest.config.ts'
      - 'web/tsconfig.json'
      - '.github/workflows/rust-scanner.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/scan-wasm/**'
      - 'web/src/scan/**'
      - 'web/scripts/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/vite.config.ts'
      - 'web/vitest.config.ts'
      - 'web/tsconfig.json'
      - '.github/workflows/rust-scanner.yml'

permissions:
  contents: read

env:
  WASM_BINDGEN_CLI: 0.2.130
  BINARYEN: version_133

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: web/scan-wasm
      - name: Install wasm-bindgen and wasm-opt
        run: |
          mkdir -p "$RUNNER_TEMP/tools/wasm-bindgen" "$RUNNER_TEMP/tools/binaryen"
          cd "$RUNNER_TEMP/tools"
          wb="wasm-bindgen-${WASM_BINDGEN_CLI}-x86_64-unknown-linux-musl"
          bin="binaryen-${BINARYEN}-x86_64-linux"
          curl -fsSL --retry 3 -o wb.tar.gz "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_CLI}/${wb}.tar.gz"
          curl -fsSL --retry 3 -o bin.tar.gz "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN}/${bin}.tar.gz"
          echo "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  wb.tar.gz" | sha256sum -c -
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  bin.tar.gz" | sha256sum -c -
          tar xzf wb.tar.gz --strip-components=1 -C wasm-bindgen
          tar xzf bin.tar.gz --strip-components=1 -C binaryen
          echo "$RUNNER_TEMP/tools/wasm-bindgen" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tools/binaryen/bin" >> "$GITHUB_PATH"
      - name: Check the binding
        working-directory: web/scan-wasm
        run: |
          cargo fmt --check
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Build the WebAssembly
        working-directory: web/scan-wasm
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir ../src/scan/wasm target/wasm32-unknown-unknown/release/collect_scan_wasm.wasm
          wasm-opt -Oz --enable-simd --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-multivalue --enable-reference-types ../src/scan/wasm/collect_scan_wasm_bg.wasm -o ../src/scan/wasm/collect_scan_wasm_bg.opt.wasm
          mv ../src/scan/wasm/collect_scan_wasm_bg.opt.wasm ../src/scan/wasm/collect_scan_wasm_bg.wasm
      - name: The committed types are the built ones
        run: git diff --exit-code web/src/scan/wasm/collect_scan_wasm.d.ts
      - run: npm ci
        working-directory: web
      - name: Fetch the corner models
        working-directory: web
        run: |
          bash scripts/fetch_docaligner.sh
          bash scripts/fetch_docaligner.sh tract
      - name: Typecheck and test
        working-directory: web
        env:
          LAZYCOLLECT_REQUIRE_RUST: '1'
        run: |
          npm run typecheck
          npm test
      - name: Build with the Rust scanner and check its size
        working-directory: web
        env:
          VITE_RUST_SCANNER: '1'
          VITE_TURNSTILE_SITEKEY: ci
        run: |
          npm run build
          npm run size
      - name: Check both scanners in Chrome
        working-directory: web
        run: npm run detect:rust
