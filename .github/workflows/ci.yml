name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: web
      - run: bash scripts/fetch_docaligner.sh
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_TURNSTILE_SITEKEY: ci
      - run: test -f ../web/dist/c.html
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: bash scripts/fetch_docaligner.sh
      - run: npm run build
        env:
          VITE_TURNSTILE_SITEKEY: ci
  ios-kit:
    # The app's API client and its tests, which need Foundation only
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Fetch the corner model
        run: bash scripts/fetch_docaligner.sh
      - name: Test CollectKit
        run: swift test --filter CollectKitTests
      # The scanner's page pipeline, and the corner model on the page photos in Tests/CollectScanModelTests
      - name: Test CollectScan
        run: swift test --filter CollectScanTests
      - name: Test CollectScanModel
        run: swift test --filter CollectScanModelTests
        env:
          LAZYCOLLECT_REQUIRE_CORNER_MODEL: '1'
  ios-app:
    # The app target, built, with its unit tests run on the Simulator
    needs: ios-kit
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Pick the simulator
        id: simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          udid=$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json, sys
          found = []
          for runtime, entries in json.load(open(sys.argv[1]))["devices"].items():
              if ".SimRuntime.iOS-" not in runtime:
                  continue
              version = tuple(int(p) for p in runtime.rsplit("iOS-", 1)[1].split("-"))
              for e in entries:
                  if e.get("isAvailable", False) and e["name"].startswith("iPhone"):
                      found.append((version, e["name"], e["udid"]))
          newest = max(f[0] for f in found)
          pro = sorted(f for f in found if f[0] == newest and "Pro Max" in f[1])
          print((pro or sorted(f for f in found if f[0] == newest))[0][2])
          PY
          )
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Boot the simulator
        run: xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          hash=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)
          if [ "$hash" != "$XCODEGEN_SHA256" ]; then
            echo "XcodeGen checksum mismatch: $hash"
            exit 1
          fi
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION"
          echo "$RUNNER_TEMP/xcodegen-$XCODEGEN_VERSION/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Fetch the corner model
        run: bash ios/scripts/fetch_docaligner.sh
      - name: Write the project
        run: xcodegen generate --spec ios/project.yml
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/LazyCollectiOS.xcodeproj \
            -scheme LazyCollectiOS \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/app-build" \
            -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES
