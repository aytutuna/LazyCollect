name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: web
      - run: bash scripts/fetch_docaligner.sh
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_TURNSTILE_SITEKEY: ci
      - run: test -f ../web/dist/c.html
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: bash scripts/fetch_docaligner.sh
      - run: npm run build
        env:
          VITE_TURNSTILE_SITEKEY: ci
  ios-kit:
    # The app's API client and its tests, which need Foundation only
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Test CollectKit
        run: swift test --filter CollectKitTests
