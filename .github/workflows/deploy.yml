name: Deploy

on: workflow_dispatch

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: test -n "${{ vars.TURNSTILE_SITEKEY }}"
      - run: npm ci
        working-directory: web
      - run: bash scripts/fetch_docaligner.sh
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
      - run: npm ci
        working-directory: server
      - run: npx wrangler d1 migrations apply lazycollect-control --remote
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler d1 migrations apply lazycollect-na --remote
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: npx wrangler deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
