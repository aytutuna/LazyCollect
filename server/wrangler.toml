# Secrets (wrangler secret put): RESEND_API_KEY, TURNSTILE_SECRET, HASH_KEY,
# MASTER_KEY_NA (32 random bytes, base64: openssl rand -base64 32; losing it makes every NA file unreadable)
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET (billing; STRIPE_PRICE_ID below is a plain var, not a secret)
# For wrangler dev put the same names in .dev.vars (gitignored), plus
# APP_URL=http://localhost:8787 so the origin check and email links match.

name = "lazycollect"
main = "src/index.ts"
compatibility_date = "2026-11-01"
account_id = "9c6272920c31b05b8706ebf88975188b"
workers_dev = false
routes = [{ pattern = "collect.alazy.app", custom_domain = true }]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/c/*", "/u/*"]

[observability]
enabled = true

[observability.logs]
invocation_logs = false

[[d1_databases]]
binding = "CONTROL"
database_name = "lazycollect-control"
database_id = "43ea5b7d-2b07-45c8-8bae-56a1487ea693"
migrations_dir = "migrations/control"

[[d1_databases]]
binding = "DB_NA"
database_name = "lazycollect-na"
database_id = "7a6bf3ef-a174-40c0-8540-b9789c7166cf"
migrations_dir = "migrations/na"

[[r2_buckets]]
binding = "FILES_NA"
bucket_name = "lazycollect-na"

[vars]
APP_URL = "https://collect.alazy.app"
EMAIL_FROM = "Lazy Collect <noreply@alazy.app>"
# the Stripe price for the C$39 monthly plan; set it before the first deploy with billing
STRIPE_PRICE_ID = ""

[[ratelimits]]
name = "LOGIN"
namespace_id = "2001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "VERIFY"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "CLIENT"
namespace_id = "2003"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "UPLOAD"
namespace_id = "2004"
simple = { limit = 30, period = 60 }

[triggers]
crons = ["*/10 * * * *"]
